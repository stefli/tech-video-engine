<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Anthropic 27%->9% 报告 · 9:16 全屏实景大字报</title>
  <style>
    :root {
      --amber: #f59e0b;
      --red: #f43f5e;
      --paper: #ffffff;
      --font-display: "Impact", "Bahnschrift", sans-serif;
      --font-cjk: "Microsoft YaHei", "PingFang SC", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2160px;
      height: 3840px;
      background: #02040a;
      color: var(--paper);
      font-family: var(--font-cjk);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .photo-background {
      position: absolute;
      inset: 0;
      background: url("./anthropic_real_9_16.jpg") center/cover no-repeat;
      filter: contrast(1.15) saturate(1.1);
    }
    .photo-readable-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(2, 4, 10, 0.6) 0%, rgba(2, 4, 10, 0.28) 40%, rgba(2, 4, 10, 0.88) 90%),
        radial-gradient(circle at 50% 45%, transparent 35%, rgba(2, 4, 10, 0.65) 100%);
      pointer-events: none;
    }
    .poster-body {
      position: absolute;
      top: 480px;
      left: 90px;
      right: 90px;
      bottom: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .top-kicker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .kicker-tape {
      background: var(--red);
      color: #fff;
      font-size: 48px;
      font-weight: 900;
      padding: 16px 42px;
      transform: rotate(-2deg);
      clip-path: polygon(0% 0%, 96% 0%, 100% 100%, 4% 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 20px;
    }
    .material-svg {
      width: 52px;
      height: 52px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .topic-tag {
      background: #000;
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 44px;
      font-weight: 900;
      padding: 16px 36px;
      letter-spacing: 0.12em;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .headline-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
      margin-top: 14px;
      width: 100%;
    }
    .main-title-lead {
      font-family: var(--font-cjk);
      font-size: 140px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.85);
      padding: 14px 40px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      letter-spacing: -0.02em;
    }
    .color-block-red {
      display: inline-block;
      background: var(--red);
      color: #ffffff;
      font-size: 190px;
      font-weight: 900;
      line-height: 1.05;
      padding: 22px 52px;
      transform: rotate(-2deg) skewX(-3deg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.02em;
    }
    .color-block-amber {
      display: inline-block;
      background: var(--amber);
      color: #000000;
      font-size: 170px;
      font-weight: 900;
      line-height: 1.05;
      padding: 20px 50px;
      transform: rotate(1.2deg) skewX(2deg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.02em;
    }
    .narrative-strip {
      background: rgba(4, 7, 16, 0.92);
      padding: 36px 48px;
      margin: 10px 0;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    }
    .narrative-strip p {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .narrative-strip p span { color: var(--amber); }
    .narrative-strip p em { color: var(--red); font-style: normal; }
    .telemetry-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      width: 100%;
      margin: 10px 0;
    }
    .telemetry-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 42px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }
    .telemetry-box.red-theme { background: #1c080e; }
    .telemetry-box.amber-theme { background: #1f1406; }
    .telemetry-label {
      font-family: var(--font-mono);
      font-size: 48px;
      font-weight: 800;
      color: #cbd5e1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .telemetry-num {
      font-family: var(--font-display);
      font-size: 116px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
    }
    .telemetry-num.red { color: var(--red); }
    .telemetry-num.amber { color: var(--amber); }
    .telemetry-sub {
      font-size: 46px;
      color: #f1f5f9;
      margin-top: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .bottom-solid-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--amber);
      color: #000000;
      padding: 34px 48px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      width: 100%;
    }
    .bottom-title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 0.01em;
    }
    .bottom-title span {
      background: #000;
      color: var(--amber);
      padding: 8px 22px;
      margin-left: 14px;
      border-radius: 4px;
    }
    .bottom-logo {
      font-family: var(--font-mono);
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="photo-background"></div>
  <div class="photo-readable-overlay"></div>
  <div class="poster-body">
    <div class="top-kicker-row">
      <div class="kicker-tape">
        <svg class="material-svg" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span>劳动力市场重塑</span>
      </div>
      <div class="topic-tag">ANTHROPIC // ECONOMIC REPORT</div>
    </div>
    <div class="headline-group">
      <div>
        <div class="main-title-lead">初级技术岗位遭遇历史性清洗</div>
      </div>
      <div>
        <div class="color-block-red">初级岗 暴跌 27%➔9%</div>
      </div>
      <div>
        <div class="color-block-amber">AGENT 工时 6X 人类</div>
      </div>
    </div>
    <div class="narrative-strip">
      <p>
        <svg class="material-svg" style="fill: var(--amber);" viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51C12.96 17.55 11 21 11 21z"/></svg>
        技术团队倒三角：<span>1 位架构师 + 智能体集群</span> 成新标配！
      </p>
    </div>
    <div class="telemetry-row">
      <div class="telemetry-box red-theme">
        <div>
          <div class="telemetry-label">初级技术岗招聘占比</div>
          <div class="telemetry-num red">27% ➔ 9%</div>
        </div>
        <div class="telemetry-sub">-67.5% 历史罕见断崖式下跌</div>
      </div>
      <div class="telemetry-box amber-theme">
        <div>
          <div class="telemetry-label">智能体有效工时杠杆</div>
          <div class="telemetry-num amber">6.2X LEVER</div>
        </div>
        <div class="telemetry-sub">每周 248 小时全自主推演交付</div>
      </div>
    </div>
    <div class="bottom-solid-bar">
      <div class="bottom-title">技术门槛跃迁 · <span>从初级编码走向架构指挥</span></div>
      <div class="bottom-logo">LABOR REPORT</div>
    </div>
  </div>
</body>
</html>
