<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Gemini 4 Argon · 9:16 全屏实景大字报</title>
  <style>
    :root {
      --green: #10b981;
      --blue: #38bdf8;
      --paper: #ffffff;
      --font-display: "Impact", "Bahnschrift", sans-serif;
      --font-cjk: "Microsoft YaHei", "PingFang SC", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2160px;
      height: 3840px;
      background: #02040a;
      color: var(--paper);
      font-family: var(--font-cjk);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .photo-background {
      position: absolute;
      inset: 0;
      background: url("./gemini_bg_9_16.jpg") center/cover no-repeat;
      filter: contrast(1.15) saturate(1.15);
    }
    .photo-readable-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(2, 4, 10, 0.6) 0%, rgba(2, 4, 10, 0.28) 40%, rgba(2, 4, 10, 0.88) 90%),
        radial-gradient(circle at 50% 45%, transparent 35%, rgba(2, 4, 10, 0.65) 100%);
      pointer-events: none;
    }
    .poster-body {
      position: absolute;
      top: 480px;
      left: 90px;
      right: 90px;
      bottom: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .top-kicker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .kicker-tape {
      background: var(--blue);
      color: #000;
      font-size: 48px;
      font-weight: 900;
      padding: 16px 42px;
      transform: rotate(-2deg);
      clip-path: polygon(0% 0%, 96% 0%, 100% 100%, 4% 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 20px;
    }
    .material-svg {
      width: 52px;
      height: 52px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .topic-tag {
      background: #000;
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 44px;
      font-weight: 900;
      padding: 16px 36px;
      letter-spacing: 0.12em;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .headline-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
      margin-top: 14px;
      width: 100%;
    }
    .main-title-lead {
      font-family: var(--font-cjk);
      font-size: 140px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.85);
      padding: 14px 40px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      letter-spacing: -0.02em;
    }
    .color-block-green {
      display: inline-block;
      background: var(--green);
      color: #000000;
      font-size: 185px;
      font-weight: 900;
      line-height: 1.05;
      padding: 22px 52px;
      transform: rotate(-2deg) skewX(-3deg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.02em;
    }
    .color-block-blue {
      display: inline-block;
      background: var(--blue);
      color: #000000;
      font-size: 170px;
      font-weight: 900;
      line-height: 1.05;
      padding: 20px 50px;
      transform: rotate(1.2deg) skewX(2deg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.02em;
    }
    .narrative-strip {
      background: rgba(4, 7, 16, 0.92);
      padding: 36px 48px;
      margin: 10px 0;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    }
    .narrative-strip p {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .narrative-strip p span { color: var(--green); }
    .narrative-strip p em { color: var(--blue); font-style: normal; }
    .telemetry-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      width: 100%;
      margin: 10px 0;
    }
    .telemetry-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 42px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }
    .telemetry-box.green-theme { background: #061f17; }
    .telemetry-box.blue-theme { background: #08172c; }
    .telemetry-label {
      font-family: var(--font-mono);
      font-size: 48px;
      font-weight: 800;
      color: #cbd5e1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .telemetry-num {
      font-family: var(--font-display);
      font-size: 112px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
    }
    .telemetry-num.green { color: var(--green); }
    .telemetry-num.blue { color: var(--blue); }
    .telemetry-sub {
      font-size: 46px;
      color: #f1f5f9;
      margin-top: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .bottom-solid-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--blue);
      color: #000000;
      padding: 34px 48px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      width: 100%;
    }
    .bottom-title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 0.01em;
    }
    .bottom-title span {
      background: #000;
      color: var(--blue);
      padding: 8px 22px;
      margin-left: 14px;
      border-radius: 4px;
    }
    .bottom-logo {
      font-family: var(--font-mono);
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="photo-background"></div>
  <div class="photo-readable-overlay"></div>
  <div class="poster-body">
    <div class="top-kicker-row">
      <div class="kicker-tape">
        <svg class="material-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>深工作交付时代</span>
      </div>
      <div class="topic-tag">GOOGLE DEEPMIND // ARGON</div>
    </div>
    <div class="headline-group">
      <div>
        <div class="main-title-lead">不再只是文字聊天升级</div>
      </div>
      <div>
        <div class="color-block-green">一张照片生成 3D 游戏</div>
      </div>
      <div>
        <div class="color-block-blue">GEMINI 4 ARGON</div>
      </div>
    </div>
    <div class="narrative-strip">
      <p>
        <svg class="material-svg" style="fill: var(--green);" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        代码库重构 · 宏大三维建筑 · <span>纯代码渲染动画</span>！
      </p>
    </div>
    <div class="telemetry-row">
      <div class="telemetry-box green-theme">
        <div>
          <div class="telemetry-label">上下文与单次吞吐</div>
          <div class="telemetry-num green">1,048,576</div>
        </div>
        <div class="telemetry-sub">百万 Token 全流程工程工作台</div>
      </div>
      <div class="telemetry-box blue-theme">
        <div>
          <div class="telemetry-label">VALS INDEX (GOOGLE)</div>
          <div class="telemetry-num blue">68.9%</div>
        </div>
        <div class="telemetry-sub">首发复杂任务榜首 · 真实交付</div>
      </div>
    </div>
    <div class="bottom-solid-bar">
      <div class="bottom-title">从提示词走向现实 · <span>把深度工作交给模型</span></div>
      <div class="bottom-logo">FRONTIER MODEL</div>
    </div>
  </div>
</body>
</html>
