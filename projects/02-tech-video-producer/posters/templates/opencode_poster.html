<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>OpenCode 24h AI 攻防 · 大字报封面 (Non-overlapping)</title>
  <style>
    :root {
      --bg: #03050a;
      --surface: #090e1c;
      --red: #f43f5e;
      --red-bright: #ff1e46;
      --blue: #38bdf8;
      --paper: #f8fafc;
      --muted: #94a3b8;
      --font-huge: "Bahnschrift", "DIN Alternate", "Impact", sans-serif;
      --font-cjk: "Microsoft YaHei", "PingFang SC", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2160px;
      height: 3840px;
      background: var(--bg);
      color: var(--paper);
      font-family: var(--font-cjk);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Cyber Mesh */
    .ambient-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 25%, rgba(244, 63, 94, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 20% 75%, rgba(56, 189, 248, 0.14) 0%, transparent 55%),
        var(--bg);
    }
    .grid-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
      background-size: 54px 54px;
      opacity: 0.6;
    }

    /* Safe Golden Container: Centered at Y=800px to Y=3040px for 1:1, 3:4 & 9:16 safe cropping */
    .poster-container {
      position: absolute;
      top: 540px;
      left: 120px;
      right: 120px;
      z-index: 10;
    }

    /* 1. Header Press Tag */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 54px;
    }
    .header-tag {
      background: #fff;
      color: #000;
      font-family: var(--font-mono);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.15em;
      padding: 14px 32px;
      text-transform: uppercase;
    }
    .header-meta {
      font-family: var(--font-mono);
      font-size: 30px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* 2. Headline Group with Generous Line-Height (Zero Overlap Guaranteed) */
    .kicker-tag {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-family: var(--font-cjk);
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.08em;
      padding: 14px 34px;
      margin-bottom: 34px;
    }
    .title-row-1 {
      font-family: var(--font-cjk);
      font-size: 190px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 16px;
    }
    .title-row-1 span {
      color: var(--red-bright);
    }
    .title-row-2 {
      font-family: var(--font-cjk);
      font-size: 170px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--blue);
      margin-bottom: 48px;
    }
    .title-row-2 span {
      color: #fff;
    }

    /* Razor Separator */
    .razor-line {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      margin-bottom: 48px;
    }

    /* 3. Core Statement */
    .statement-title {
      font-size: 60px;
      line-height: 1.38;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 22px;
    }
    .statement-title span {
      color: var(--red);
    }
    .statement-sub {
      font-size: 38px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 56px;
    }

    /* 4. Telemetry Multiplier Blocks (Solid Fill, High Contrast, Ample Padding) */
    .telemetry-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      margin-bottom: 54px;
    }
    .telemetry-card {
      background: var(--surface);
      padding: 44px 48px;
      border-radius: 4px;
    }
    .telemetry-card.danger-card {
      background: #18090d;
    }
    .telemetry-label {
      font-family: var(--font-mono);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: var(--muted);
    }
    .telemetry-label.danger { color: var(--red); }
    .telemetry-label.accent { color: var(--blue); }
    .telemetry-val {
      font-family: var(--font-huge);
      font-size: 108px;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 14px;
    }
    .telemetry-val.danger { color: var(--red-bright); }
    .telemetry-val.accent { color: var(--blue); }
    .telemetry-desc {
      font-size: 28px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* 5. Bottom Anchor */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 34px 48px;
      border-radius: 4px;
    }
    .footer-text {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
    }
    .footer-sub {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.18em;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="grid-dots"></div>

  <div class="poster-container">
    <!-- 1. Header -->
    <div class="header-bar">
      <div class="header-tag">网络安全前沿观点 // BRIEFING</div>
      <div class="header-meta">OPENCODE SECURITY REPORT</div>
    </div>

    <!-- 2. Headline Group (Zero Overlap Guaranteed) -->
    <div class="kicker-tag">24H 永续渗透 · 机器对抗机器</div>
    <h1 class="title-row-1">24H <span>AI 攻防战</span></h1>
    <div class="title-row-2">防守常驻 <span>AGENT</span></div>

    <!-- Razor Line -->
    <div class="razor-line"></div>

    <!-- 3. Statement -->
    <div class="statement-title">
      每秒 <span>4.8 万次</span> 高频渗透，人类值班修漏洞体系彻底失效。
    </div>
    <div class="statement-sub">
      以机器速度应对机器速度 · 代码安全全面进入常驻自愈智能体时代
    </div>

    <!-- 4. Telemetry -->
    <div class="telemetry-row">
      <div class="telemetry-card danger-card">
        <div class="telemetry-label danger">平均修复周期 (MTTR)</div>
        <div class="telemetry-val danger">72h ➔ 3.2s</div>
        <div class="telemetry-desc">收敛漏洞暴露窗口 80,000 倍</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label accent">恶意攻击拦截率</div>
        <div class="telemetry-val accent">99.4%</div>
        <div class="telemetry-desc">动态污点追踪 · 秒级生成热补丁</div>
      </div>
    </div>

    <!-- 5. Footer Anchor -->
    <div class="footer-bar">
      <div class="footer-text">没有常驻 Agent 的代码库都是在裸奔</div>
      <div class="footer-sub">SECURITY DOSSIER</div>
    </div>
  </div>
</body>
</html>
