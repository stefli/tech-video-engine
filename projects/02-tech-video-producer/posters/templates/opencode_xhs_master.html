<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>OpenCode 24h AI 攻防 · 小红书爆款大字报封面 (实景背景+带底色块+零遮挡)</title>
  <style>
    :root {
      --yellow: #ffe500;
      --yellow-glow: rgba(255, 229, 0, 0.45);
      --red: #ff2442;
      --red-glow: rgba(255, 36, 66, 0.45);
      --blue: #0284c7;
      --blue-bright: #38bdf8;
      --dark: #040711;
      --paper: #ffffff;
      --ink: #000000;
      --font-display: "Impact", "Bahnschrift", "Arial Black", sans-serif;
      --font-cjk: "Microsoft YaHei", "PingFang SC", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2160px;
      height: 2880px; /* 3:4 Standard Ratio */
      background: var(--dark);
      color: var(--paper);
      font-family: var(--font-cjk);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Real Photo Layer with Depth and Vignette */
    .photo-bg {
      position: absolute;
      inset: -40px;
      background: url("./tech_bg.jpg") center/cover no-repeat;
      filter: brightness(0.38) contrast(1.25) saturate(1.1);
      transform: scale(1.03);
    }
    .vignette-layer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 40%, transparent 20%, rgba(4, 7, 17, 0.7) 70%, #040711 100%),
        linear-gradient(180deg, rgba(4, 7, 17, 0.8) 0%, transparent 35%, rgba(4, 7, 17, 0.95) 85%);
      pointer-events: none;
    }

    /* Clean Flex Container (Zero Occlusion, Vertical Document Flow) */
    .canvas {
      position: absolute;
      top: 140px;
      left: 100px;
      right: 100px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    /* 1. Top Bar with Bold Solid Badges */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .top-left-badges {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .badge-solid-red {
      background: var(--red);
      color: #fff;
      font-size: 36px;
      font-weight: 900;
      padding: 14px 32px;
      border-radius: 8px;
      letter-spacing: 0.08em;
      box-shadow: 0 10px 30px var(--red-glow);
    }
    .badge-solid-black {
      background: #000;
      color: var(--yellow);
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 800;
      padding: 14px 30px;
      border-radius: 8px;
      letter-spacing: 0.14em;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .top-right-meta {
      font-family: var(--font-mono);
      font-size: 30px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* 2. Main Title Group - Every Line Has a Saturated Background Plate */
    .headline-flow {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
      margin-top: 30px;
      width: 100%;
    }
    
    /* Line 1: Black Solid Block with White Impact Text */
    .block-line-1 {
      display: inline-block;
      background: rgba(0, 0, 0, 0.9);
      color: #ffffff;
      font-size: 140px;
      font-weight: 900;
      line-height: 1.1;
      padding: 16px 44px;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      letter-spacing: -0.02em;
    }

    /* Line 2: Giant Fluorescent Yellow Block with Pure Black Text (小红书精髓) */
    .block-line-2 {
      display: inline-block;
      background: var(--yellow);
      color: var(--ink);
      font-size: 180px;
      font-weight: 900;
      line-height: 1.05;
      padding: 20px 48px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 50px var(--yellow-glow);
      letter-spacing: -0.02em;
      transform: rotate(-1.5deg);
    }

    /* Line 3: Saturated Red Block with Pure White Text */
    .block-line-3 {
      display: inline-block;
      background: var(--red);
      color: #ffffff;
      font-size: 160px;
      font-weight: 900;
      line-height: 1.05;
      padding: 18px 48px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 50px var(--red-glow);
      letter-spacing: -0.02em;
      transform: rotate(1deg);
    }

    /* 3. Narrative Bullet Strips (带暗色背景色块，文字高亮) */
    .bullets-cluster {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 20px 0;
      width: 100%;
    }
    .bullet-plate {
      background: rgba(15, 23, 42, 0.92);
      padding: 24px 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      width: fit-content;
    }
    .bullet-plate.accent {
      background: rgba(30, 15, 20, 0.92);
    }
    .bullet-icon {
      font-size: 38px;
    }
    .bullet-text {
      font-size: 42px;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1.35;
    }
    .bullet-text strong {
      color: var(--yellow);
    }
    .bullet-text strong.red {
      color: #ff6b81;
    }

    /* 4. Shocking Data Cards Row (有极强背景色，字极大绝不挤叠) */
    .data-cards-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      width: 100%;
      margin: 10px 0;
    }
    .data-card {
      background: #0f172a;
      padding: 38px 46px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .data-card.red-card {
      background: #1c080d;
      border-bottom: 8px solid var(--red);
    }
    .data-card.blue-card {
      background: #071529;
      border-bottom: 8px solid var(--blue-bright);
    }
    .card-label {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-num {
      font-family: var(--font-display);
      font-size: 110px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
    }
    .card-num.red {
      color: var(--red);
      text-shadow: 0 0 35px var(--red-glow);
    }
    .card-num.blue {
      color: var(--blue-bright);
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
    }
    .card-desc {
      font-size: 28px;
      color: #cbd5e1;
      margin-top: 14px;
      font-weight: 600;
    }

    /* 5. Bottom Solid Banner */
    .bottom-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--yellow);
      color: #000;
      padding: 30px 48px;
      border-radius: 14px;
      box-shadow: 0 15px 40px var(--yellow-glow);
      width: 100%;
    }
    .banner-text {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .banner-text span {
      background: #000;
      color: var(--yellow);
      padding: 6px 18px;
      border-radius: 6px;
      margin-left: 12px;
    }
    .banner-sub {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="photo-bg"></div>
  <div class="vignette-layer"></div>

  <div class="canvas">
    <!-- 1. Top Badges -->
    <div class="top-bar">
      <div class="top-left-badges">
        <div class="badge-solid-red">独家深度分析</div>
        <div class="badge-solid-black">OPENCODE 2026</div>
      </div>
      <div class="top-right-meta">AI RED TEAM REPORT</div>
    </div>

    <!-- 2. Headline with Bold Background Plates (零遮挡、每行独立色块) -->
    <div class="headline-flow">
      <div>
        <div class="block-line-1">开源代码库遭遇</div>
      </div>
      <div>
        <div class="block-line-2">24H 连续 AI 攻防</div>
      </div>
      <div>
        <div class="block-line-3">防守必须常驻 AGENT</div>
      </div>
    </div>

    <!-- 3. Key Findings with Dark Background Strips -->
    <div class="bullets-cluster">
      <div class="bullet-plate accent">
        <span class="bullet-icon">⚡</span>
        <span class="bullet-text">每秒 <strong>4.8 万次</strong> 渗透测试，人类值班修漏洞 <strong class="red">彻底失效</strong></span>
      </div>
      <div class="bullet-plate">
        <span class="bullet-icon">🛡️</span>
        <span class="bullet-text">以机器速度对抗机器速度，代码防御必须 <strong>全天候常驻自愈</strong></span>
      </div>
    </div>

    <!-- 4. Massive Shocking Data Cards -->
    <div class="data-cards-row">
      <div class="data-card red-card">
        <div>
          <div class="card-label">平均修复时间 (MTTR)</div>
          <div class="card-num red">72h ➔ 3.2s</div>
        </div>
        <div class="card-desc">漏洞暴露时间缩短 80,000 倍</div>
      </div>

      <div class="data-card blue-card">
        <div>
          <div class="card-label">零日恶意威胁拦截率</div>
          <div class="card-num blue">99.4%</div>
        </div>
        <div class="card-desc">动态污点追踪 · 自动编译热补丁</div>
      </div>
    </div>

    <!-- 5. Bottom Solid Warning Banner -->
    <div class="bottom-banner">
      <div class="banner-text">以 AI 制 AI · <span>没有常驻 Agent 都是裸奔</span></div>
      <div class="banner-sub">PERSPECTIVE</div>
    </div>
  </div>
</body>
</html>
