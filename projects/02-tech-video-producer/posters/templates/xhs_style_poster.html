<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>OpenCode 24h 攻防 · 小红书爆款大字报封面</title>
  <style>
    :root {
      --bg: #080c16;
      --yellow: #facc15;
      --yellow-bright: #ffe600;
      --red: #ff2d55;
      --blue: #38bdf8;
      --paper: #ffffff;
      --ink: #000000;
      --card-bg: rgba(255, 255, 255, 0.05);
      --font-display: "Impact", "Bahnschrift", sans-serif;
      --font-cjk: "Microsoft YaHei", "PingFang SC", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2160px;
      height: 2880px; /* Standard 3:4 High-Density Aspect Ratio for Xiaohongshu & Channels */
      background: var(--bg);
      color: var(--paper);
      font-family: var(--font-cjk);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Ambient Texture */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 85% 15%, rgba(250, 204, 21, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(255, 45, 85, 0.14) 0%, transparent 50%),
        #070b14;
      pointer-events: none;
    }
    .dot-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.5px);
      background-size: 40px 40px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Xiaohongshu Editorial Frame */
    .canvas {
      position: absolute;
      inset: 120px 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    /* Top Badge & Topic Bar */
    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pill-kicker {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: var(--red);
      color: #fff;
      font-size: 38px;
      font-weight: 900;
      padding: 12px 30px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(255, 45, 85, 0.4);
    }
    .pill-kicker i {
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      display: inline-block;
    }
    .meta-channel {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    /* Xiaohongshu Core Big Typography Section (大字报核心区) */
    .headline-group {
      margin-top: 40px;
    }
    .title-line-1 {
      font-size: 150px;
      font-weight: 900;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    /* The Classic Xiaohongshu Marker-Highlight Box (实心荧光马克笔底色块) */
    .highlight-box {
      display: inline-block;
      background: var(--yellow-bright);
      color: #000000;
      font-size: 175px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      padding: 16px 40px;
      margin-bottom: 28px;
      box-shadow: 0 15px 40px rgba(250, 204, 21, 0.4);
      transform: rotate(-1deg);
    }
    .title-line-3 {
      font-size: 160px;
      font-weight: 900;
      line-height: 1.08;
      color: var(--blue);
      letter-spacing: -0.02em;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
    }
    .title-line-3 span {
      color: #fff;
    }

    /* Key Takeaway Badges (小红书核心爆点胶囊群) */
    .badges-cluster {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 40px 0;
    }
    .badge-item {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      background: rgba(255, 255, 255, 0.08);
      padding: 24px 38px;
      border-radius: 18px;
      width: fit-content;
    }
    .badge-icon {
      font-size: 40px;
    }
    .badge-text {
      font-size: 44px;
      font-weight: 800;
      color: #f1f5f9;
    }
    .badge-text strong {
      color: var(--yellow);
    }
    .badge-text strong.danger {
      color: var(--red);
    }

    /* Big Numbers Shock Card (数据暴击大卡) */
    .stats-card {
      background: #0f172a;
      border-radius: 24px;
      padding: 44px 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }
    .stat-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-title {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .stat-number {
      font-family: var(--font-display);
      font-size: 110px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
    }
    .stat-number.red {
      color: var(--red);
      text-shadow: 0 0 30px rgba(255, 45, 85, 0.4);
    }
    .stat-number.yellow {
      color: var(--yellow);
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
    }
    .stat-sub {
      font-size: 30px;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* Bottom Author & Summary Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      border-top: 2px solid rgba(255, 255, 255, 0.12);
    }
    .verdict-tag {
      font-size: 44px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .verdict-tag span {
      color: var(--yellow);
    }
    .author-badge {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #1e293b;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 30px;
      font-weight: 700;
      color: #94a3b8;
    }
    .author-badge i {
      width: 14px;
      height: 14px;
      background: var(--blue);
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="dot-pattern"></div>

  <div class="canvas">
    <!-- Top Metadata -->
    <div class="top-meta">
      <div class="pill-kicker"><i></i>科技前沿特快 · 独家拆解</div>
      <div class="meta-channel">OPENCODE SECURITY PERSPECTIVE</div>
    </div>

    <!-- Core Big Typography -->
    <div class="headline-group">
      <div class="title-line-1">开源代码库遭遇</div>
      <div class="highlight-box">24H 连续 AI 攻防</div>
      <div class="title-line-3">防守必须 <span>常驻 AGENT</span></div>
    </div>

    <!-- Badges Cluster -->
    <div class="badges-cluster">
      <div class="badge-item">
        <span class="badge-icon">⚡</span>
        <span class="badge-text">每秒 <strong>4.8 万次</strong> 渗透测试，人类值班彻底失效</span>
      </div>
      <div class="badge-item">
        <span class="badge-icon">🛡️</span>
        <span class="badge-text">秒级自愈热补丁，恶意漏洞阻断率达 <strong>99.4%</strong></span>
      </div>
    </div>

    <!-- Big Numbers Shock Card -->
    <div class="stats-card">
      <div class="stat-col">
        <div class="stat-title">平均修复周期 (MTTR)</div>
        <div class="stat-number red">72h➔3.2s</div>
        <div class="stat-sub">漏洞暴露时间缩短 80,000 倍</div>
      </div>
      <div class="stat-col" style="text-align: right;">
        <div class="stat-title">常驻防御状态</div>
        <div class="stat-number yellow">24/7 自愈</div>
        <div class="stat-sub">零日攻击自动化拦截</div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="verdict-tag">以 AI 制 AI · <span>没有常驻 Agent 都是裸奔</span></div>
      <div class="author-badge"><i></i>深度技术观点</div>
    </div>
  </div>
</body>
</html>
